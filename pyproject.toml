[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardian-research"
version = "0.1.0"
description = "An experiment factory for catapult/grokking training dynamics, dynamic grokking, and Guardian-Angel personalization. Local control plane, disposable GPU workers, repo as source of truth."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Guardian Research" }]

# Core dependencies. Deliberately lean so that `uv sync` is fast and the first
# deliverable runs on a CPU with NO model downloads. Heavy/cloud/LLM tooling is
# gated behind optional extras below.
dependencies = [
    "torch>=2.2,<3",
    "numpy>=1.24",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3",
    "pydantic>=2.5,<3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "tabulate>=0.9",  # pandas.DataFrame.to_markdown backend for reports
    "rich>=13.0",
    "jinja2>=3.1",
    # MLflow is imported lazily and degrades gracefully if missing; kept in core
    # so `ga ... ` logs to a local file store and `mlflow ui` works out of the box.
    "mlflow>=2.9,<3",
]

[project.optional-dependencies]
# Cloud launching. NOT required for `ga launch --dry-run` (which only renders
# YAML/commands). Only needed to actually submit jobs.
cloud = ["skypilot>=0.6"]
# Real (non-toy) language-model personalization / dynamic evaluation.
llm = ["transformers>=4.40", "peft>=0.10", "datasets>=2.18", "accelerate>=0.29"]
# Data/artifact versioning. The repo is DVC-*compatible* without DVC installed.
dvc = ["dvc>=3.0"]

[project.scripts]
ga = "guardian_research.cli:main"

[dependency-groups]
# Installed by default with `uv sync`.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guardian_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: marks tests that require a GPU (deselect with '-m \"not gpu\"')",
    "slow: marks slow tests (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter; long strings are fine

[tool.guardian]
# Single source of truth for budget/autonomy policy. Read by the budget guard.
# These mirror the Tier-1 ("bounded automation") gates in the planning docs.
max_job_cost_usd = 5.0
max_daily_cost_usd = 25.0
total_budget_usd = 2000.0
allowed_providers = ["runpod", "lambda", "modal"]
allowed_data_classes = ["public", "synthetic"]
allow_private_persona_data = false
require_clean_git_tree = true
require_exact_commit_sha = true
require_dry_run_first = true
