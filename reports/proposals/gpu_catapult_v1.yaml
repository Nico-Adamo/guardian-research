schema_version: 1.0.0
name: gpu_catapult_v1
experiment: arithmetic_catapult
hypothesis: >-
  H001: cyclic weight-decay schedule groks sooner / generalizes better on
  HARD arithmetic (OOD-length + carry-heavy) than baseline_cosine at matched
  compute — "the curves cross" on the hard split.
expected_signal: >-
  cyclic_wd_tuned's final_hard_acc exceeds baseline_cosine's by a margin
  that holds across 3 seeds. Secondary: onecycle_high_lr may also cross at
  moderate WD. The signal should appear in hard_ood_acc (length extrapolation)
  and/or hard_carry_acc (carry-chain generalization).
metric: 'final_hard_acc (decomposed: final_hard_ood_acc, final_hard_carry_acc)'
ablation: >-
  baseline_cosine is the control at matched steps (40k) and matched model
  (small_transformer, 256d/6L/rope). Vary weight_decay x schedule x seed to
  isolate whether WD cycling drives the hard-split gain. The cyclic-WD
  multiplier is co-tuned per base_wd (informed by CPU modular sweep
  reports/runs/modular_grok_sweep_v1.md).
stop_conditions:
  - Stop a shard if train_loss is NaN/Inf or train_acc < 0.05 after 20k steps.
  - >-
    Stop the sweep (downgrade H001) if no non-baseline schedule beats baseline
    final_hard_acc across all 3 seeds at any WD setting.
  - 'Hard total-cost ceiling: $12.00 USD (per-job <= $5.00 USD).'

base_config: +exp=arithmetic_catapult_gpu model=small_transformer

sweep:
  schedule:
    - baseline_cosine
    - cyclic_wd_tuned
    - onecycle_high_lr
  train.weight_decay:
    - 0.01
    - 0.05
    - 0.15

# cyclic_wd_tuned bakes in wd_max_mult=3.0 (vs the default 20.0), so peak WD is
# always 3× base_wd — 0.03, 0.15, or 0.45 for the three WD settings. This keeps
# it in the "moderate periodic regularization" range that worked on CPU.

seeds: [0, 1, 2]

# Grid: 3 schedules × 3 WDs × 3 seeds = 27 jobs

data_class: synthetic
provider: runpod
gpu: rtx4090
hours_per_job: 0.4
per_job_cost_usd: 0.18
estimated_cost_usd: 4.75
max_cost_usd: 12.00

created_from_runs:
  - modular_sweep_v1_108_runs

reproducibility:
  git_sha: ec58d2195221f5b8d3d2a1e55008a669a76a636a
  git_dirty: false
  requires_clean_tree: true
  requires_exact_sha: true
  config: +exp=arithmetic_catapult_gpu model=small_transformer
  grid_size: 27

rationale: >-
  The CPU modular-grokking sweep (108 runs) showed cyclic_weight_decay (with
  co-tuned multiplier) groks in 96% of configs vs baseline's 74%, and 2-4x
  faster in hard regimes (mean step 1145 vs 2933 where baseline struggles).
  This passes H001's scale-honesty stop condition. The GPU experiment tests
  whether the same mechanism produces length-extrapolation gains on base-10
  multi-digit arithmetic with a small_transformer (256d/6L/rope, 40k steps,
  200k training examples, testing on 11-20 digit OOD). Grid narrowed from
  original 48-job proposal to 27 by dropping cyclic_lr (strictly worse than
  baseline on CPU) and focusing WD on 0.01-0.15 range.
