# Larger model for GPU-scale runs (present but NOT launched by default).
# Skinny-ish (depth over width), matching the catapult essay's intuition.
name: small_transformer
d_model: 256
n_layers: 6
n_heads: 8
d_ff: 1024
dropout: 0.0
tie_weights: true
pos_encoding: rope # GPU-scale runs default to rope so OOD-length extrapolation is possible
rope_base: 10000.0
