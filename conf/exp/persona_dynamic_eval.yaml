# @package _global_
# Guardian-Angel persona pipeline (CPU-toy defaults, SYNTHETIC data only).
# Compares base | rag-only | lora (stub) | dynamic-eval (stub) on a fictional
# persona corpus. No private data, no model downloads. See planning/guardian/.
experiment: persona_dynamic_eval
runner: persona

# The persona block is consumed by experiments/persona/train_persona.py:run().
persona:
  out_dir: data/persona_synthetic/v0
  prepare: true            # (re)generate the synthetic corpus before evaluating
  n_personas: 3            # 2 or 3 fictional personas
  docs_per_persona: 12
  holdout_frac: 0.34       # ~1/3 of docs reserved for held-out eval
  active_top_k: 3          # top active-learning questions to propose per persona
  variants:                # which systems to compare (order preserved in metrics)
    - base
    - rag-only
    - lora
    - dynamic-eval

# Present for schema/config uniformity; the persona runner does not train a model.
train:
  max_steps: 0
